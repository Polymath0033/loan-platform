spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Polymath0033/loan-app.git
          clone-on-start: true
          default-label: main
  # Credentials that client services use to authenticate with this config server.
  security:
    user:
      name: config-user
      password: config-secret

server:
  port: 8888

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: false   # config-server does not need to discover other services
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,bus-refresh
  endpoint:
    health:
      show-details: always
